name: Bonsai mask codebook

on:
  push:
    branches:
      - experiment/functional-compression-probe
    paths:
      - "bonsai-cv/mask_codebook.py"
      - ".github/workflows/bonsai-mask-codebook.yml"
  workflow_dispatch:

jobs:
  codebook:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { layer: 14, frac: "0.25" }
          - { layer: 14, frac: "0.50" }
          - { layer: 27, frac: "0.25" }
          - { layer: 27, frac: "0.50" }
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: "/tmp/hf-cache"
      CASE_LAYER: ${{ matrix.layer }}
      CASE_FRAC: ${{ matrix.frac }}
      NUM_MASKS: "16"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.57,<5" "datasets>=3,<5" "accelerate>=1,<2" safetensors

      - name: Run mask-codebook probe
        working-directory: bonsai-cv
        run: python mask_codebook.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mask-codebook-l${{ matrix.layer }}-p${{ matrix.frac }}
          path: bonsai-cv/results-mask-codebook/
          if-no-files-found: warn
