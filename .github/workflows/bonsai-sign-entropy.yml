name: Bonsai sign entropy audit

on:
  push:
    branches:
      - experiment/functional-compression-probe
    paths:
      - "bonsai-cv/sign_entropy.py"
      - ".github/workflows/bonsai-sign-entropy.yml"
  workflow_dispatch:

jobs:
  entropy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: "/tmp/hf-cache"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.57,<5" "accelerate>=1,<2" safetensors

      - name: Run sign-structure audit
        working-directory: bonsai-cv
        run: python sign_entropy.py

      - name: Publish summary
        if: always()
        run: |
          if [ -f bonsai-cv/results-bonsai-sign-entropy/summary.md ]; then
            cat bonsai-cv/results-bonsai-sign-entropy/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-sign-entropy
          path: bonsai-cv/results-bonsai-sign-entropy/
          if-no-files-found: warn
