name: Bonsai scale composition

on:
  push:
    branches:
      - experiment/functional-compression-probe
    paths:
      - "bonsai-cv/scale_composition.py"
      - ".github/workflows/bonsai-scale-composition.yml"
  workflow_dispatch:

jobs:
  composition:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { set: "five", fold: 0 }
          - { set: "five", fold: 1 }
          - { set: "all", fold: 0 }
          - { set: "all", fold: 1 }
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: "/tmp/hf-cache"
      CASE_SET: ${{ matrix.set }}
      CASE_FOLD: ${{ matrix.fold }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.57,<5" "datasets>=3,<5" "accelerate>=1,<2" safetensors
      - name: Run scale composition
        working-directory: bonsai-cv
        run: python scale_composition.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-composition-${{ matrix.set }}-f${{ matrix.fold }}
          path: bonsai-cv/results-scale-composition/
          if-no-files-found: warn
