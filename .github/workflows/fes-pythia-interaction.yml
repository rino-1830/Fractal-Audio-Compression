name: FES Pythia interaction decomposition
on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths:
      - "experiments/fes-pythia-interaction/**"
      - ".github/workflows/fes-pythia-interaction.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets accelerate
      - run: python experiments/fes-pythia-interaction/fes_pythia_interaction.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fes-pythia-interaction-results
          path: results-pythia-interaction/
          if-no-files-found: warn
