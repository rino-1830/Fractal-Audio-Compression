name: FES Bonsai window-direction candidates
on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths:
      - "experiments/fes-bonsai-window-directions/**"
      - ".github/workflows/fes-bonsai-window-directions.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  directions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets accelerate
      - name: Exact diverse-direction search
        run: python experiments/fes-bonsai-window-directions/fes_window_directions.py --layers 3 --out results-window-directions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fes-window-directions-results
          path: results-window-directions/
          if-no-files-found: warn
