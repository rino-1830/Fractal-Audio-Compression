name: FES integrated Qwen ternary PTQ
on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths:
      - "experiments/fes-qwen-ternary/**"
      - ".github/workflows/fes-qwen-ternary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets accelerate
      - name: Integrated Qwen ternary FES
        run: python experiments/fes-qwen-ternary/fes_qwen_ternary.py --layers 6 --out results-qwen-ternary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fes-qwen-ternary-results
          path: results-qwen-ternary/
          if-no-files-found: warn
