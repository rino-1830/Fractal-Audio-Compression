name: FES Bonsai fixed-choice large evaluation
on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths:
      - "experiments/fes-bonsai-large/**"
      - ".github/workflows/fes-bonsai-large.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets accelerate
      - name: Large fixed-choice evaluation
        run: python experiments/fes-bonsai-large/fes_bonsai_large.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fes-bonsai-large-results
          path: results-bonsai-large/
          if-no-files-found: warn
