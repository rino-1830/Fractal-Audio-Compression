name: Bonsai gated joint coordinate

on:
  push:
    branches:
      - experiment/functional-compression-probe
    paths:
      - "bonsai-cv/joint_coordinate_gate.py"
      - ".github/workflows/bonsai-joint-coordinate-gate.yml"
  workflow_dispatch:

jobs:
  gated-joint:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        fold: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: "/tmp/hf-cache"
      CASE_FOLD: ${{ matrix.fold }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.57,<5" "datasets>=3,<5" "accelerate>=1,<2" safetensors
      - name: Run gated joint coordinate selector
        working-directory: bonsai-cv
        run: python joint_coordinate_gate.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gated-joint-f${{ matrix.fold }}
          path: bonsai-cv/results-joint-coordinate-gate/
          if-no-files-found: warn
