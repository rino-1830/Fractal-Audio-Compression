name: FES greedy sweep efficiency
on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths:
      - "experiments/fes-greedy/**"
      - ".github/workflows/fes-greedy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  greedy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets accelerate
      - run: python experiments/fes-greedy/fes_greedy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: fes-greedy-results, path: results-greedy/, if-no-files-found: warn}
