name: Bonsai model-wide family schedule

on:
  push:
    branches:
      - experiment/functional-compression-probe
    paths:
      - "bonsai-cv/family_schedule.py"
      - ".github/workflows/bonsai-family-schedule.yml"
  workflow_dispatch:

jobs:
  family-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: "/tmp/hf-cache"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.57,<5" "datasets>=3,<5" "accelerate>=1,<2" safetensors
      - name: Run model-wide family schedules
        working-directory: bonsai-cv
        run: python family_schedule.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-family-schedule
          path: bonsai-cv/results-family-schedule/
          if-no-files-found: warn
