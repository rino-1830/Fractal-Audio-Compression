name: FES Qwen ternary mixed-domain quick
on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths:
      - ".github/workflows/fes-qwen-mixed-quick.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets accelerate
      - name: Quick mixed-domain robust ternary FES
        run: python experiments/fes-qwen-mixed/fes_qwen_mixed.py --layers 3 --beta 0.5 --out results-quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fes-qwen-mixed-quick
          path: results-quick/
          if-no-files-found: warn
