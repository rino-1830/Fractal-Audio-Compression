name: FES Bonsai validation-aware quick
on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths:
      - ".github/workflows/fes-bonsai-validation-quick.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets accelerate
      - name: Validation-aware FES quick
        run: python experiments/fes-bonsai-validation/fes_validation.py --layers 4 --beam 128 --rerank 12 --topk 32 --out results-valfes-quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fes-validation-quick-results
          path: results-valfes-quick/
          if-no-files-found: warn
