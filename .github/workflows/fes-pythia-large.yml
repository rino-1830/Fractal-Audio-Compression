name: FES Pythia large heldout
on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths:
      - "experiments/fes-pythia-large/**"
      - ".github/workflows/fes-pythia-large.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  large:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets
      - name: Large heldout FES
        run: python experiments/fes-pythia-large/fes_pythia_large.py --out results-pythia-large
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fes-pythia-large-results
          path: results-pythia-large/
          if-no-files-found: warn
