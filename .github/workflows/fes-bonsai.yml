name: FES on actual Ternary Bonsai
on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths:
      - "experiments/fes-bonsai/**"
      - ".github/workflows/fes-bonsai.yml"
  pull_request:
    paths:
      - "experiments/fes-bonsai/**"
      - ".github/workflows/fes-bonsai.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bonsai:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Resources
        run: |
          free -h
          df -h .
          nproc
      - name: Install CPU stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets accelerate
      - name: Bonsai scale-only FES
        run: python experiments/fes-bonsai/fes_bonsai.py --layers 2 --out results-bonsai
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fes-bonsai-results
          path: results-bonsai/
          if-no-files-found: warn
