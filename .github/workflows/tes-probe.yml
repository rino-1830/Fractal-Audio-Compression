name: Tangent Error Shaping probe
on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths:
      - "experiments/tes-probe/**"
      - ".github/workflows/tes-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets accelerate
      - run: python experiments/tes-probe/tes_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tes-probe-results
          path: results-tes/
          if-no-files-found: warn
