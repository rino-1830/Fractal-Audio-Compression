name: FES Bonsai directional packets
on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths:
      - "experiments/fes-bonsai-packets/**"
      - ".github/workflows/fes-bonsai-packets.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets accelerate
      - name: Exact directional packet search
        run: python experiments/fes-bonsai-packets/fes_bonsai_packets.py --layers 3 --out results-packets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fes-bonsai-packets-results
          path: results-packets/
          if-no-files-found: warn
