name: Bonsai cross-layer sign entropy

on:
  push:
    branches:
      - experiment/functional-compression-probe
    paths:
      - "bonsai-cv/crosslayer_sign_entropy.py"
      - ".github/workflows/bonsai-crosslayer-sign.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: "/tmp/hf-cache"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.57,<5" "accelerate>=1,<2" safetensors
      - name: Audit cross-layer sign entropy
        working-directory: bonsai-cv
        run: python crosslayer_sign_entropy.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-crosslayer-sign
          path: bonsai-cv/results-crosslayer-sign/
          if-no-files-found: warn
