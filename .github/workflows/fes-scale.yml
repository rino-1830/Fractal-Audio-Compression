name: FES scale 31M 70M

on:
  pull_request:
    paths:
      - "experiments/fes-scale/**"
      - ".github/workflows/fes-scale.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale:
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: EleutherAI/pythia-31m
            slug: pythia31m
          - model: EleutherAI/pythia-70m
            slug: pythia70m
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets scipy
      - name: Decode shared experiment helpers
        run: |
          base64 -d experiments/fes-transformer/fes_transformer.py.b64 > experiments/fes-transformer/fes_transformer.py
      - name: Run scale experiment
        run: |
          python experiments/fes-scale/fes_scale.py \
            --model "${{ matrix.model }}" \
            --out "results-${{ matrix.slug }}" \
            --cal-windows 3 \
            --test-windows 6 \
            --passes 1
          cat "results-${{ matrix.slug }}/summary.md"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "fes-scale-${{ matrix.slug }}"
          path: "results-${{ matrix.slug }}/"
          if-no-files-found: warn
