name: FES Bonsai multi-direction scale-field search
on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths:
      - "experiments/fes-bonsai-field/**"
      - ".github/workflows/fes-bonsai-field.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets accelerate
      - name: Exact scale-field search
        run: python experiments/fes-bonsai-field/fes_bonsai_field.py --layers 3 --offset 0 --out results-bonsai-field
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fes-bonsai-field-results
          path: results-bonsai-field/
          if-no-files-found: warn
