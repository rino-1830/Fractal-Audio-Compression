name: FES exact coordinate refinement

on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths:
      - "experiments/fes-coordinate/**"
      - ".github/workflows/fes-coordinate.yml"
  pull_request:
    paths:
      - "experiments/fes-coordinate/**"
      - ".github/workflows/fes-coordinate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets scipy
      - name: Decode base experiment
        run: |
          base64 -d experiments/fes-transformer/fes_transformer.py.b64 > experiments/fes-transformer/fes_transformer.py
      - name: Run exact cross-layer refinement
        run: |
          python experiments/fes-coordinate/fes_coordinate.py --model EleutherAI/pythia-14m --out results-coordinate --passes 2
          cat results-coordinate/summary.md
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fes-coordinate-results
          path: results-coordinate/
          if-no-files-found: warn
