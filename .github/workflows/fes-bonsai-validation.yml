name: FES Bonsai validation-aware sketch
on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths:
      - "experiments/fes-bonsai-validation/**"
      - ".github/workflows/fes-bonsai-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  valfes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets accelerate
      - name: Validation-aware FES
        run: python experiments/fes-bonsai-validation/fes_validation.py --layers 6 --beam 512 --rerank 64 --topk 32 --out results-valfes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fes-validation-results
          path: results-valfes/
          if-no-files-found: warn
