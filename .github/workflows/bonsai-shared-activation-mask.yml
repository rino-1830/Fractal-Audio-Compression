name: Bonsai shared activation mask

on:
  push:
    branches:
      - experiment/functional-compression-probe
    paths:
      - "bonsai-cv/shared_activation_mask.py"
      - ".github/workflows/bonsai-shared-activation-mask.yml"
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        layer: [0, 14, 27]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: "/tmp/hf-cache"
      CASE_LAYER: ${{ matrix.layer }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.57,<5" "datasets>=3,<5" "accelerate>=1,<2" safetensors
      - name: Run shared activation mask probe
        working-directory: bonsai-cv
        run: python shared_activation_mask.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-activation-mask-l${{ matrix.layer }}
          path: bonsai-cv/results-shared-activation-mask/
          if-no-files-found: warn
