name: Functional subspace compression PoC

on:
  push:
    branches:
      - experiment/functional-subspace-llm-compression
    paths:
      - ".github/workflows/functional-subspace-poc.yml"
      - "experiments/llm-functional-subspace/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    name: experiment-seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 13, 29, 47]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: experiments/llm-functional-subspace/requirements.txt

      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install experiment dependencies
        run: pip install -r experiments/llm-functional-subspace/requirements.txt

      - name: Run falsification experiment
        run: |
          python experiments/llm-functional-subspace/experiment.py \
            --seed ${{ matrix.seed }} \
            --output-dir results

      - name: Publish summary
        if: always()
        run: |
          if [ -f results/summary.md ]; then
            echo "## Seed ${{ matrix.seed }}" >> "$GITHUB_STEP_SUMMARY"
            cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-subspace-results-seed-${{ matrix.seed }}
          path: results/
          if-no-files-found: warn
