name: FES transformer experiment

on:
  push:
    branches:
      - "experiment/fes-transformer-20260926"
    paths:
      - "experiments/fes-transformer/**"
      - ".github/workflows/fes-transformer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distilgpt2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: 4
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers numpy
      - name: Run 4-layer pretrained-transformer FES experiment
        run: |
          python experiments/fes-transformer/transformer_fes.py \
            --model distilgpt2 \
            --layers 4 \
            --seq-len 64 \
            --cal-blocks 4 \
            --test-blocks 8 \
            --batch-size 2 \
            --beam-width 64 \
            --rerank 6 \
            --out results/transformer_fes.json
      - name: Print result summary
        run: |
          python - <<'PY'
          import json
          r=json.load(open("results/transformer_fes.json"))
          print(json.dumps(r["summary"], indent=2))
          for k,v in r["methods"].items():
              print(k, {
                  "test_kl": v["test"]["kl"],
                  "test_ce": v["test"]["ce"],
                  "top1": v["test"]["top1_agreement"],
                  "weight_mse": v["weight_mse_mean"],
                  "cancel": v["linearized_cancellation_ratio"],
              })
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fes-transformer-results
          path: results/
          if-no-files-found: error
