name: FES local-start sweep efficiency
on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths: ["experiments/fes-localstart/**",".github/workflows/fes-localstart.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: {HF_HUB_DISABLE_TELEMETRY: "1", TOKENIZERS_PARALLELISM: "false", OMP_NUM_THREADS: "4"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets accelerate
      - run: python experiments/fes-localstart/fes_localstart.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: fes-localstart-results, path: results-localstart/, if-no-files-found: warn}
