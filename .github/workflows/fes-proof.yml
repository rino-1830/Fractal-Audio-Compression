name: FES proof of concept

on:
  push:
    branches:
      - "experiment/fes-proof-20260925"
    paths:
      - "experiments/fes-proof/**"
      - ".github/workflows/fes-proof.yml"
  pull_request:
    paths:
      - "experiments/fes-proof/**"
      - ".github/workflows/fes-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check "numpy==2.1.1"
      - name: Run multi-seed FES experiment
        run: |
          python experiments/fes-proof/fes_experiment.py --out results --seeds 24
          cat results/summary.md
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: fes-proof-results
          path: results/
          if-no-files-found: error
