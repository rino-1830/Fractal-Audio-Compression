name: Functional compression probe

on:
  push:
    branches:
      - experiment/functional-compression-probe
    paths:
      - "llm-functional-compression/experiment.py"
      - "llm-functional-compression/holdout.py"
      - "llm-functional-compression/crossval.py"
      - ".github/workflows/functional-compression-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.53,<5" "scipy>=1.13,<2" "datasets>=3,<5"

      - name: Run cross-split validation
        working-directory: llm-functional-compression
        run: python crossval.py

      - name: Publish summary
        if: always()
        run: |
          if [ -f llm-functional-compression/results-crossval/summary.md ]; then
            cat llm-functional-compression/results-crossval/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-compression-crossval
          path: llm-functional-compression/results-crossval/
          if-no-files-found: warn
