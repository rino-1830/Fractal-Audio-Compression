name: Bonsai rate matrix

on:
  push:
    branches:
      - experiment/functional-compression-probe
    paths:
      - "bonsai-cv/rate_shard.py"
      - ".github/workflows/bonsai-rate-matrix.yml"
  workflow_dispatch:

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { layer: 0,  group: 256, fold: 0 }
          - { layer: 0,  group: 512, fold: 0 }
          - { layer: 14, group: 128, fold: 0 }
          - { layer: 14, group: 256, fold: 0 }
          - { layer: 14, group: 512, fold: 0 }
          - { layer: 27, group: 128, fold: 0 }
          - { layer: 27, group: 256, fold: 0 }
          - { layer: 27, group: 512, fold: 0 }
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: "/tmp/hf-cache"
      CASE_LAYER: ${{ matrix.layer }}
      CASE_GROUP: ${{ matrix.group }}
      CASE_FOLD: ${{ matrix.fold }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.57,<5" "datasets>=3,<5" "scipy>=1.13,<2" "accelerate>=1,<2" safetensors

      - name: Run rate shard
        working-directory: bonsai-cv
        run: python rate_shard.py

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rate-l${{ matrix.layer }}-g${{ matrix.group }}-f${{ matrix.fold }}
          path: bonsai-cv/results-rate-shard/
          if-no-files-found: warn
