name: FES Bonsai functional-error sketch
on:
  push:
    branches: ["experiment/fes-transformer-20260926"]
    paths:
      - "experiments/fes-bonsai-sketch/**"
      - ".github/workflows/fes-bonsai-sketch.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sketch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers datasets accelerate
      - name: Functional-error sketch FES
        run: python experiments/fes-bonsai-sketch/fes_bonsai_sketch.py --layers 6 --beam 128 --rerank 12 --topk 32 --out results-sketch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fes-bonsai-sketch-results
          path: results-sketch/
          if-no-files-found: warn
