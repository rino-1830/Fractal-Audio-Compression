name: Bonsai robust gradient selector

on:
  push:
    branches:
      - experiment/functional-compression-probe
    paths:
      - "bonsai-cv/robust_gradient_selector.py"
      - ".github/workflows/bonsai-robust-gradient.yml"
  workflow_dispatch:

jobs:
  robust:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        layer: [14, 27]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: "/tmp/hf-cache"
      CASE_LAYER: ${{ matrix.layer }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.57,<5" "datasets>=3,<5" "accelerate>=1,<2" safetensors
      - name: Run robust selector
        working-directory: bonsai-cv
        run: python robust_gradient_selector.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robust-gradient-l${{ matrix.layer }}
          path: bonsai-cv/results-robust-gradient-selector/
          if-no-files-found: warn
